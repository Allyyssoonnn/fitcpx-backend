version: "3.8"

services:
   fitcpx1:
      build: .
      image: fitcpx
      env_file:
         - .env
      ports:
         - "8070:8070" # contêiner 1

   fitcpx2:
      build: .
      image: fitcpx
      env_file:
         - .env
      ports:
         - "8071:8070" # contêiner 2, interna 8070, externa 8071
      depends_on:
         - fitcpx1

   db:
      image: postgres:latest
      hostname: db
      environment:
         - POSTGRES_PASSWORD=2025@Admin
         - POSTGRES_USER=admin
         - POSTGRES_DB=metric
      ports:
         - "5432:5432"
      volumes:
         - ./devops/sql/ddl.sql:/docker-entrypoint-initdb.d/script.sql
         - ./data/postgres-data:/var/lib/postgresql/data
      # deploy:
      #   resources:
      #     limits:
      #       cpus: "0.56"
      #       memory: "410MB"

      # ------ monitoring services -------
   opentelemetry-collector:
      hostname: opentelemetry-collector
      image: otel/opentelemetry-collector:latest
      command: ["--config=/etc/otel-collector-config.yml", "--feature-gates=pkg.translator.prometheus.NormalizeName"]
      volumes:
         - ./infra/otel-collector-config.yml:/etc/otel-collector-config.yml
      restart: unless-stopped
      environment:
         - DEPLOY_ENV=dev
      ports:
         - "8888:8888" # Prometheus metrics exposed by the collector
         - "8889:8889" # Prometheus exporter metrics
         - "4317:4317" # OTLP gRPC receiver
      depends_on:
         - prometheus

   grafana:
      image: grafana/grafana:latest
      container_name: grafana
      ports:
         - "3000:3000"
      volumes:
         - ./infra/grafana/provisioning:/etc/grafana/provisioning #https://grafana.com/docs/grafana/latest/administration/provisioning/
         - ./data/grafana-data:/var/lib/grafana
         - /etc/localtime:/etc/localtime:ro

      environment:
         - GF_AUTH_ANONYMOUS_ENABLED=true
         - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
         - GF_AUTH_DISABLE_LOGIN_FORM=true
         - GF_INSTALL_PLUGINS=https://storage.googleapis.com/integration-artifacts/grafana-exploretraces-app/grafana-exploretraces-app-latest.zip;grafana-traces-app

      links:
         - opentelemetry-collector
         - prometheus

   prometheus:
      image: prom/prometheus:latest
      command:
         - --config.file=/etc/prometheus.yaml
         - --web.enable-remote-write-receiver
         - --enable-feature=otlp-write-receiver
         - --enable-feature=exemplar-storage
         - --enable-feature=native-histograms
      volumes:
         - ./infra/prometheus.yaml:/etc/prometheus.yaml
         - /etc/localtime:/etc/localtime:ro
         - ./data/prometheus-data:/prometheus
      ports:
         - "9090:9090"
