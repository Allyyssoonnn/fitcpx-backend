name: Deploy FitCpx

on:
   push:
      branches:
         - main

jobs:
   deploy:
      runs-on: ubuntu-latest

      steps:
         - name: Conectar no servidor e rodar docker-compose
           uses: appleboy/ssh-action@v0.1.6
           with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USER }}
              key: ${{ secrets.SERVER_SSH_KEY }}
              port: 22
              script: |
                 cd Git/servereducapp
                 git fetch origin main
                 git reset --hard origin/main
                 sudo docker compose -p fitcpx_prod -f docker-compose.yml pull
                 sudo docker compose -p fitcpx_prod -f docker-compose.yml down
                 sudo docker compose -p fitcpx_prod -f docker-compose.yml up -d --remove-orphans --build
